name: build-sbf

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup default 1.89.0
          rustup component add rustfmt

      - name: Install Solana CLI + build SBF programs
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo-build-sbf --version
          cargo-build-sbf --manifest-path programs/rampart/Cargo.toml
          cargo-build-sbf --manifest-path programs/oracle-mock/Cargo.toml

      - name: Run litesvm tests
        run: cargo test -p rampart

      - name: Upload program artifact
        uses: actions/upload-artifact@v4
        with:
          name: rampart-so
          path: target/deploy/rampart.so
          if-no-files-found: error

      - name: Upload oracle-mock artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-mock-so
          path: target/deploy/oracle_mock.so
          if-no-files-found: error
  web-check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm run typecheck
      - name: Production web build
        run: pnpm run build:web
